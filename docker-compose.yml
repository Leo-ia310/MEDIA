services:
  media:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5500,http://127.0.0.1:5500}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-90}
      BACKEND_PUBLIC_BASE_URL: ${BACKEND_PUBLIC_BASE_URL:-http://127.0.0.1:8000}
      LOCAL_DATABASE_PATH: ${LOCAL_DATABASE_PATH:-/app/backend/data/media_local.db}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_LOW_MODEL: ${GROQ_LOW_MODEL:-openai/gpt-oss-20b}
      GROQ_MEDIUM_MODEL: ${GROQ_MEDIUM_MODEL:-qwen/qwen3.8-27b}
      GROQ_HIGH_MODEL: ${GROQ_HIGH_MODEL:-openai/gpt-oss-120b}
      GROQ_VISION_MODEL: ${GROQ_VISION_MODEL:-qwen/qwen3.8-27b}
      GROQ_TIMEOUT_SECONDS: ${GROQ_TIMEOUT_SECONDS:-35}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-gemini-3.1-flash-lite-image}
      GEMINI_IMAGE_QUALITY_MODEL: ${GEMINI_IMAGE_QUALITY_MODEL:-gemini-3.1-flash-image}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-60}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_AI_MODEL: ${CLOUDFLARE_AI_MODEL:-@cf/qwen/qwen3.8-27b}
      AI_MODEL_LOW: ${AI_MODEL_LOW:-}
      AI_MODEL_MEDIUM: ${AI_MODEL_MEDIUM:-}
      AI_MODEL_HIGH: ${AI_MODEL_HIGH:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-@cf/qwen/qwen3-embedding-0.6b}
      AI_TIMEOUT_FALLBACK_TO_LOW: ${AI_TIMEOUT_FALLBACK_TO_LOW:-true}
      ALLOW_AI_CALLS: ${ALLOW_AI_CALLS:-true}
      STRICT_DOCUMENT_GROUNDING: ${STRICT_DOCUMENT_GROUNDING:-false}
      OBSIDIAN_RETRIEVAL_ENABLED: ${OBSIDIAN_RETRIEVAL_ENABLED:-false}
      OBSIDIAN_VAULT_PATH: ${OBSIDIAN_VAULT_PATH:-/app/obsidian}
      OBSIDIAN_MEMORY_SUBDIRS: ${OBSIDIAN_MEMORY_SUBDIRS:-proyectos/media}
      OBSIDIAN_MAX_FILES: ${OBSIDIAN_MAX_FILES:-400}
      OBSIDIAN_CHUNK_CHARS: ${OBSIDIAN_CHUNK_CHARS:-1800}
      PROJECT_CONTEXT_TOP_K: ${PROJECT_CONTEXT_TOP_K:-3}
      MEDICAL_RETRIEVAL_CANDIDATE_LIMIT: ${MEDICAL_RETRIEVAL_CANDIDATE_LIMIT:-800}
      REFERENCES_DIR: ${REFERENCES_DIR:-/app/Referencias}
      REFERENCE_MARKDOWN_DIR: ${REFERENCE_MARKDOWN_DIR:-/app/Referencias/MDs}
      REFERENCE_CHUNK_CHARS: ${REFERENCE_CHUNK_CHARS:-1800}
    volumes:
      - media_data:/app/backend/data
    restart: unless-stopped

volumes:
  media_data:
